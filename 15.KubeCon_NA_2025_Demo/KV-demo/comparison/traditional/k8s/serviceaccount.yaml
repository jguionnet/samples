apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-api-sa
  namespace: default
  annotations:
    # IAM role annotation for IRSA (IAM Roles for Service Accounts)
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/default-product-api-role"
  labels:
    app: product-catalog-api
    component: backend
